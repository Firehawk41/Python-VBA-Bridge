[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vba-bridge"
version = "0.1.0"
description = "Run VBA-compatible Basic code programmatically and iterate on errors, like a REPL for VBA."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout>=2"]
excel = ["pywin32; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["vba_bridge*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a real soffice/UNO install",
    "slow: soak / long-running tests",
]
